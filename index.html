<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚗️ 普通化学考核方式公投 - 华中科技大学未来技术学院</title>

    <!-- Supabase JS 客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>

    <style>
        :root {
            --closed-color: #e74c3c;
            --closed-color-light: #fce4e4;
            --closed-color-dark: #c0392b;
            --open-color: #2980b9;
            --open-color-light: #e3f0fa;
            --open-color-dark: #1a5276;
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --bg-card-2: #0f3460;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --gold: #f0c060;
            --accent: #e94560;
            --glass-bg: rgba(22, 33, 62, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.5);
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(233, 68, 96, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(41, 128, 185, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(240, 192, 96, 0.03) 0%, transparent 60%);
            background-attachment: fixed;
        }

        /* 浮动分子粒子 */
        .molecule-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .molecule-particle {
            position: absolute;
            border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0.35;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(105vh) translateX(0) scale(0);
                opacity: 0;
            }
            5% {
                opacity: 0.4;
            }
            40% {
                opacity: 0.5;
            }
            80% {
                opacity: 0.2;
            }
            100% {
                transform: translateY(-10vh) translateX(60px) scale(1.2);
                opacity: 0;
            }
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            padding: 20px;
            margin: 20px auto;
        }

        /* 玻璃卡片 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }
        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 255, 255, 0.015), transparent, rgba(255, 255, 255, 0.01), transparent);
            animation: shimmer 12s linear infinite;
            pointer-events: none;
        }
        @keyframes shimmer {
            to {
                transform: rotate(360deg);
            }
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
            z-index: 1;
        }
        .header .icon-row {
            font-size: 48px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header .icon-row .emoji-big {
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        .header .icon-row .emoji-big:nth-child(1) {
            animation-delay: 0s;
        }
        .header .icon-row .emoji-big:nth-child(2) {
            animation-delay: 0.3s;
        }
        .header .icon-row .emoji-big:nth-child(3) {
            animation-delay: 0.6s;
        }
        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-14px);
            }
            50% {
                transform: translateY(0);
            }
            70% {
                transform: translateY(-7px);
            }
            85% {
                transform: translateY(0);
            }
        }
        .header h1 {
            font-size: 1.9em;
            font-weight: 900;
            background: linear-gradient(135deg, #f0c060, #e94560, #f0c060);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease-in-out infinite;
            margin: 8px 0;
            line-height: 1.3;
        }
        @keyframes gradientShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .header .subtitle {
            font-size: 0.95em;
            color: var(--text-secondary);
            letter-spacing: 1px;
            margin-top: 4px;
        }
        .header .badge-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.78em;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ccc;
        }

        /* 投票按钮区域 */
        .vote-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 28px;
            position: relative;
            z-index: 1;
        }
        @media (max-width: 500px) {
            .vote-buttons {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .glass-card {
                padding: 28px 18px;
            }
            .header h1 {
                font-size: 1.4em;
            }
        }
        .vote-btn {
            position: relative;
            padding: 28px 20px;
            border-radius: var(--radius-md);
            border: 2px solid transparent;
            cursor: pointer;
            font-size: 1.15em;
            font-weight: 700;
            letter-spacing: 1px;
            transition: all var(--transition);
            text-align: center;
            color: #fff;
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        .vote-btn:active {
            transform: scale(0.94);
            transition: transform 0.1s;
        }
        .vote-btn .btn-emoji {
            font-size: 2.6em;
            transition: transform var(--transition);
        }
        .vote-btn:hover .btn-emoji {
            transform: scale(1.2) rotate(-8deg);
        }
        .vote-btn .btn-label {
            font-size: 1em;
        }
        .vote-btn .btn-sub {
            font-size: 0.7em;
            opacity: 0.7;
            font-weight: 400;
            letter-spacing: 0;
        }

        /* 闭卷按钮 */
        .vote-btn-closed {
            background: linear-gradient(135deg, #c0392b, #e74c3c, #c0392b);
            background-size: 200% 200%;
            animation: pulseClosed 3s ease-in-out infinite;
            border-color: rgba(231, 76, 60, 0.5);
        }
        .vote-btn-closed:hover {
            border-color: #e74c3c;
            box-shadow: 0 12px 40px rgba(231, 76, 60, 0.5);
            transform: translateY(-4px);
        }
        @keyframes pulseClosed {
            0%,
            100% {
                background-position: 0% 50%;
                box-shadow: 0 8px 30px rgba(231, 76, 60, 0.3);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 14px 44px rgba(231, 76, 60, 0.55);
            }
        }

        /* 开卷按钮 */
        .vote-btn-open {
            background: linear-gradient(135deg, #1a5276, #2980b9, #1a5276);
            background-size: 200% 200%;
            animation: pulseOpen 3s ease-in-out infinite;
            border-color: rgba(41, 128, 185, 0.5);
            animation-delay: 0.5s;
        }
        .vote-btn-open:hover {
            border-color: #2980b9;
            box-shadow: 0 12px 40px rgba(41, 128, 185, 0.5);
            transform: translateY(-4px);
        }
        @keyframes pulseOpen {
            0%,
            100% {
                background-position: 0% 50%;
                box-shadow: 0 8px 30px rgba(41, 128, 185, 0.3);
            }
            50% {
                background-position: 100% 50%;
                box-shadow: 0 14px 44px rgba(41, 128, 185, 0.55);
            }
        }

        /* 冷却覆盖层 */
        .vote-btn.cooling {
            pointer-events: none;
            opacity: 0.55;
            cursor: not-allowed;
            filter: grayscale(30%);
        }
        .vote-btn.cooling::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            border-radius: var(--radius-md);
            z-index: 2;
        }
        .cooling-timer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            font-size: 2em;
            font-weight: 900;
            color: #fff;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }

        /* 结果展示区 */
        .results-area {
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
        }
        .results-area h3 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 1em;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .result-bar-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 12px;
        }
        .result-bar-label {
            width: 70px;
            text-align: right;
            font-weight: 700;
            font-size: 0.9em;
            flex-shrink: 0;
        }
        .result-bar-label.closed-label {
            color: #e74c3c;
        }
        .result-bar-label.open-label {
            color: #5dade2;
        }
        .result-bar-track {
            flex: 1;
            height: 28px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }
        .result-bar-fill {
            height: 100%;
            border-radius: 14px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 14px;
            font-weight: 700;
            font-size: 0.85em;
            color: #fff;
            min-width: 40px;
            white-space: nowrap;
        }
        .result-bar-fill.closed-fill {
            background: linear-gradient(90deg, #c0392b, #e74c3c);
        }
        .result-bar-fill.open-fill {
            background: linear-gradient(90deg, #1a5276, #2980b9);
        }
        .result-bar-count {
            width: 50px;
            font-weight: 700;
            font-size: 0.9em;
            text-align: left;
            flex-shrink: 0;
            color: #ccc;
        }
        .total-votes-display {
            text-align: center;
            font-size: 0.85em;
            color: var(--text-secondary);
            margin-top: 6px;
        }
        .total-votes-display strong {
            color: var(--gold);
            font-size: 1.2em;
        }

        /* 战况评语 */
        .battle-commentary {
            text-align: center;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            margin-top: 16px;
            font-style: italic;
            color: #ccc;
            font-size: 0.9em;
            position: relative;
            z-index: 1;
            border-left: 3px solid var(--gold);
            transition: all var(--transition);
        }
        .battle-commentary .comment-icon {
            display: inline-block;
            margin-right: 4px;
            animation: bounce 1.5s ease-in-out infinite;
        }

        /* 投票动态滚动条 */
        .live-feed {
            position: relative;
            z-index: 1;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 0.78em;
            color: #999;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .live-feed h4 {
            font-size: 0.85em;
            color: #aaa;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .live-feed .feed-item {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            animation: fadeInFeed 0.4s ease-out;
        }
        @keyframes fadeInFeed {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .feed-item .feed-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .feed-dot.closed-dot {
            background: #e74c3c;
            box-shadow: 0 0 8px #e74c3c;
        }
        .feed-dot.open-dot {
            background: #2980b9;
            box-shadow: 0 0 8px #2980b9;
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            z-index: 999;
            background: #2ecc71;
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1em;
            letter-spacing: 1px;
            box-shadow: 0 10px 40px rgba(46, 204, 113, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            text-align: center;
            max-width: 90vw;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.error-toast {
            background: #e74c3c;
            box-shadow: 0 10px 40px rgba(231, 76, 60, 0.5);
        }

        /* 后台入口 */
        .admin-entry {
            position: relative;
            z-index: 1;
            text-align: center;
            margin-top: 20px;
        }
        .admin-entry button {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.8em;
            letter-spacing: 1px;
            transition: all var(--transition);
        }
        .admin-entry button:hover {
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
        }

        /* 后台面板 */
        .admin-panel-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s;
        }
        .admin-panel-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .admin-panel {
            background: #1a1a2e;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-lg);
            padding: 32px 24px;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        .admin-panel h2 {
            text-align: center;
            margin-bottom: 20px;
            color: var(--gold);
            letter-spacing: 2px;
            font-size: 1.4em;
        }
        .admin-panel .close-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6em;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity var(--transition);
        }
        .admin-panel .close-btn:hover {
            opacity: 1;
        }
        .admin-stat-card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: var(--radius-sm);
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .admin-stat-card h4 {
            color: #aaa;
            margin-bottom: 6px;
            font-size: 0.85em;
            letter-spacing: 1px;
        }
        .admin-stat-card .big-number {
            font-size: 2.4em;
            font-weight: 900;
            color: #fff;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8em;
            margin-top: 10px;
        }
        .admin-table th,
        .admin-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        .admin-table th {
            color: #aaa;
            letter-spacing: 1px;
            font-weight: 600;
            font-size: 0.75em;
            text-transform: uppercase;
        }
        .admin-table td {
            color: #ccc;
        }
        .admin-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
        }
        .admin-actions button {
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all var(--transition);
            font-size: 0.85em;
        }
        .admin-actions button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #fff;
        }
        .admin-actions button.danger-btn {
            border-color: rgba(231, 76, 60, 0.5);
            color: #e74c3c;
        }
        .admin-actions button.danger-btn:hover {
            background: rgba(231, 76, 60, 0.2);
            border-color: #e74c3c;
        }
        .admin-password-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 1em;
            text-align: center;
            letter-spacing: 2px;
            outline: none;
            transition: all var(--transition);
        }
        .admin-password-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(240, 192, 96, 0.3);
        }
        .admin-login-hint {
            text-align: center;
            color: #888;
            font-size: 0.78em;
            margin-top: 6px;
        }

        /* 粒子爆炸效果 */
        .particle-burst {
            position: fixed;
            pointer-events: none;
            z-index: 200;
        }
        .burst-dot {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: burstFly 0.7s ease-out forwards;
        }
        @keyframes burstFly {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.25em;
            }
            .header .icon-row {
                font-size: 36px;
            }
            .vote-btn {
                padding: 20px 14px;
                font-size: 1em;
            }
            .vote-btn .btn-emoji {
                font-size: 2em;
            }
            .result-bar-label {
                width: 50px;
                font-size: 0.75em;
            }
            .result-bar-count {
                width: 36px;
                font-size: 0.75em;
            }
            .admin-panel {
                padding: 20px 14px;
            }
            .admin-stat-card .big-number {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>

    <!-- 浮动分子粒子背景 -->
    <div class="molecule-particles" id="moleculeParticles"></div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <!-- 粒子爆炸容器 -->
    <div class="particle-burst" id="particleBurst"></div>

    <!-- 主容器 -->
    <div class="main-container" id="mainContainer">
        <div class="glass-card" id="mainCard">
            <!-- 标题 -->
            <div class="header">
                <div class="icon-row">
                    <span class="emoji-big">⚗️</span>
                    <span class="emoji-big">🧪</span>
                    <span class="emoji-big">🔬</span>
                </div>
                <h1>普通化学考核方式公投</h1>
                <p class="subtitle">华中科技大学 · 未来技术学院</p>
                <div class="badge-row">
                    <span class="badge">📚 普通化学</span>
                    <span class="badge">🎯 全民公投</span>
                    <span class="badge">🔄 可反复投票</span>
                </div>
            </div>

            <!-- 投票按钮 -->
            <div class="vote-buttons" id="voteButtons">
                <button class="vote-btn vote-btn-closed" onclick="castVote('closed', this)" id="btnClosed">

<script>
    // ============================================

        anonKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxYmN4Z3F6aG96Y3lybmlzc2pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NzU0MjEsImV4cCI6MjA5NDI1MTQyMX0.0Il0-ZMHc9dEAMENveMAmXq1bwO98GzG2kjHdMsAIS0' // 替换为你的 Supabase anon/public key

    // ============================================
    //  初始化 Supabase 客户端

    let supabaseClient = null;
    let isSupabaseConfigured = false;

    function initSupabase() {
        if (SUPABASE_CONFIG.url.includes('your-project-id') ||
            SUPABASE_CONFIG.anonKey.includes('your-anon-key')) {
            console.warn('⚠️ Supabase 未配置，请在代码中设置你的 Supabase URL 和 anonKey');
            isSupabaseConfigured = false;
            showToast('⚠️ 数据库未配置，请先设置 Supabase', true);
            // 显示模拟数据提示
            document.getElementById('totalVotes').textContent = '（未连接数据库）';
            document.getElementById('battleCommentary').innerHTML =
                '<span class="comment-icon">⚠️</span> 请在源码中配置 Supabase 数据库连接信息';
            return null;
        }
        try {
            supabaseClient = supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey);

            return supabaseClient;

            console.error('❌ Supabase 初始化失败:', err);
            isSupabaseConfigured = false;
            showToast('❌ 数据库连接失败', true);
            return null;
        }
    }

    // ============================================
    //  工具函数
    // ============================================
    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast ' + (isError ? 'error-toast' : '');
        // 强制回流
        toast.offsetHeight;
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2200);
    }

    function createParticleBurst(x, y, color) {
        const container = document.getElementById('particleBurst');
        const count = 18;
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < count; i++) {
            const dot = document.createElement('div');
            dot.className = 'burst-dot';
            const angle = (Math.PI * 2 * i) / count;
            const distance = 40 + Math.random() * 70;
            dot.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
            dot.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
            dot.style.backgroundColor = color;
            dot.style.left = '0px';
            dot.style.top = '0px';
            dot.style.width = (4 + Math.random() * 8) + 'px';
            dot.style.height = dot.style.width;
            fragment.appendChild(dot);
        }
        container.style.left = x + 'px';
        container.style.top = y + 'px';
        container.innerHTML = '';
        container.appendChild(fragment);
        setTimeout(() => {
            container.innerHTML = '';
        }, 750);
    }

    function getRandomChemistryComment(option, diffPercent, totalVotes) {
        const closedComments = [
            '📖 闭卷派强势出击！知识的力量在凝聚...',
            '🔬 闭卷支持者正在结晶析出，纯度极高！',
            '📚 闭卷阵营反应剧烈，产率持续上升！',
            '🧪 闭卷催化剂已添加，反应加速中！',
            '📖 传统学派发力了！熵值在下降...',
            '⚗️ 闭卷派蒸馏进行中，浓度越来越高！',
            '📖 闭卷党：让考试回归本质！',
            '💪 闭卷支持率正在发生链式反应！',
        ];
        const openComments = [
            '📂 开卷派自由能降低，稳定态达成！',
            '🌟 开卷支持者如气体扩散，势不可挡！',
            '📂 开卷阵营的焓变有利，自发进行中！',
            '💡 开卷党：理解才是硬道理！',
            '📂 开卷派溶解度飙升，完全溶解！',
            '🎯 开卷支持率正在发生相变，气势如虹！',
            '📂 开卷党：让化学回归生活！',
            '✨ 开卷阵营的活化能已跨越，反应一触即发！',
        ];
        const tieComments = [
            '⚖️ 反应达到动态平衡，双方势均力敌！',
            '🔥 战况胶着！这是一场等摩尔的对决...',
            '⚖️ 可逆反应进行中，正逆速率相等！',
            '🎭 难分伯仲！需要更多催化剂介入...',
            '⚖️ 平衡常数接近1，双方旗鼓相当！',
        ];
        const closeComments = [
            '🔥 差距在缩小！勒夏特列原理正在发挥作用...',
            '👀 紧追不舍！反应向反方向移动中...',
            '⚡ 微弱差距！任何一票都可能改变平衡！',
            '🎯 势均力敌！这比滴定终点还难判断...',
        ];

        if (totalVotes < 5) {
            return '🆕 投票刚刚开始，快来参与这场化学盛宴吧！';
        }
        if (Math.abs(diffPercent) < 3) {
            return tieComments[Math.floor(Math.random() * tieComments.length)];
        }
        if (Math.abs(diffPercent) < 10) {
            return closeComments[Math.floor(Math.random() * closeComments.length)];
        }
        if (option === 'closed' && diffPercent > 0) {
            return closedComments[Math.floor(Math.random() * closedComments.length)];
        }
        if (option === 'open' && diffPercent < 0) {
            return openComments[Math.floor(Math.random() * openComments.length)];
        }
        // 落后方的评论
        if (diffPercent > 0) {
            return openComments[Math.floor(Math.random() * openComments.length)];
        } else {
            return closedComments[Math.floor(Math.random() * closedComments.length)];
        }
    }

    // ============================================
    //  投票逻辑
    // ============================================
    let isCoolingDown = false;
    let cooldownTimer = null;

    async function castVote(option, buttonElement) {
        if (!isSupabaseConfigured || !supabaseClient) {
            showToast('⚠️ 数据库未连接，请先配置 Supabase', true);
            return;
        }
        if (isCoolingDown) {
            showToast('⏳ 请稍等片刻再投票哦~', true);
            return;
        }

        // 进入冷却
        isCoolingDown = true;
        const allButtons = document.querySelectorAll('.vote-btn');
        allButtons.forEach(b => b.classList.add('cooling'));

        // 在按钮上显示冷却倒计时
        let remaining = COOLDOWN_SECONDS;
        const timerDisplay = document.createElement('span');
        timerDisplay.className = 'cooling-timer';
        timerDisplay.textContent = remaining;
        buttonElement.appendChild(timerDisplay);

        cooldownTimer = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
                clearInterval(cooldownTimer);
                cooldownTimer = null;
                timerDisplay.remove();
                allButtons.forEach(b => b.classList.remove('cooling'));
                isCoolingDown = false;
            } else {
                timerDisplay.textContent = remaining;
            }
        }, 1000);

        // 插入投票记录
        try {
            const { data, error } = await supabaseClient
                .from('votes')
                .insert([{ option: option }])
                .select();

            if (error) {
                console.error('投票失败:', error);
                showToast('❌ 投票失败，请重试', true);
                // 提前结束冷却
                clearInterval(cooldownTimer);
                cooldownTimer = null;
                timerDisplay.remove();
                allButtons.forEach(b => b.classList.remove('cooling'));
                isCoolingDown = false;
                return;
            }

            // 投票成功！
            const rect = buttonElement.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const color = option === 'closed' ? '#e74c3c' : '#2980b9';
            createParticleBurst(cx, cy, color);

            const optionName = option === 'closed' ? '闭卷考试' : '开卷考试';
            const emoji = option === 'closed' ? '📖' : '📂';
            showToast(`${emoji} 你投了「${optionName}」！投票成功！`);

            // 刷新显示
            await refreshResults();
            await refreshLiveFeed();

        } catch (err) {
            console.error('投票异常:', err);
            showToast('❌ 网络错误，请检查连接', true);
            clearInterval(cooldownTimer);
            cooldownTimer = null;
            timerDisplay.remove();
            allButtons.forEach(b => b.classList.remove('cooling'));
            isCoolingDown = false;
        }
    }

    // ============================================
    //  获取投票结果
    // ============================================
    async function getVoteCounts() {
        if (!isSupabaseConfigured || !supabaseClient) {
            return { closed: 0, open: 0, total: 0, closedVotes: [], openVotes: [] };
        }
        try {
            // 获取闭卷票数
            const { count: closedCount, error: err1 } = await supabaseClient
                .from('votes')
                .select('*', { count: 'exact', head: true })
                .eq('option', 'closed');

            // 获取开卷票数
            const { count: openCount, error: err2 } = await supabaseClient
                .from('votes')
                .select('*', { count: 'exact', head: true })
                .eq('option', 'open');

            if (err1 || err2) {
                console.error('获取票数失败:', err1 || err2);
                return { closed: 0, open: 0, total: 0, closedVotes: [], openVotes: [] };
            }

            const closed = closedCount || 0;
            const open = openCount || 0;
            return { closed, open, total: closed + open };
        } catch (err) {
            console.error('获取票数异常:', err);
            return { closed: 0, open: 0, total: 0 };
        }
    }

    async function refreshResults() {
        const counts = await getVoteCounts();
        const { closed, open, total } = counts;

        document.getElementById('closedCount').textContent = closed + ' 票';
        document.getElementById('openCount').textContent = open + ' 票';
        document.getElementById('totalVotes').textContent = total;

        const closedPercent = total > 0 ? Math.round((closed / total) * 100) : 50;
        const openPercent = total > 0 ? Math.round((open / total) * 100) : 50;

        const closedBar = document.getElementById('closedBar');
        const openBar = document.getElementById('openBar');
        closedBar.style.width = closedPercent + '%';
        closedBar.textContent = closedPercent + '%';
        openBar.style.width = openPercent + '%';
        openBar.textContent = openPercent + '%';

        // 如果某方为0，调整显示
        if (closed === 0 && open === 0) {
            closedBar.style.width = '50%';
            closedBar.textContent = '0%';
            openBar.style.width = '50%';
            openBar.textContent = '0%';
            closedBar.style.minWidth = '50px';
            openBar.style.minWidth = '50px';
        } else if (closed === 0) {
            closedBar.style.width = '3px';
            closedBar.textContent = '';
            closedBar.style.minWidth = '3px';
            openBar.style.minWidth = '40px';
        } else if (open === 0) {
            openBar.style.width = '3px';
            openBar.textContent = '';
            openBar.style.minWidth = '3px';
            closedBar.style.minWidth = '40px';
        } else {
            closedBar.style.minWidth = '40px';
            openBar.style.minWidth = '40px';
        }

        // 更新战况评语
        const diffPercent = closedPercent - openPercent;
        const leadingOption = diffPercent > 0 ? 'closed' : (diffPercent < 0 ? 'open' : 'tie');
        const comment = getRandomChemistryComment(leadingOption, diffPercent, total);
        document.getElementById('battleCommentary').innerHTML =
            '<span class="comment-icon">' + (diffPercent > 0 ? '📖' : (diffPercent < 0 ? '📂' : '⚖️')) +
            '</span> ' + comment;
    }

    // ============================================
    //  实时动态滚动
    // ============================================
    async function refreshLiveFeed() {
        if (!isSupabaseConfigured || !supabaseClient) return;
        try {
            const { data, error } = await supabaseClient
                .from('votes')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(30);

            if (error || !data) return;

            const feedContent = document.getElementById('feedContent');
            if (data.length === 0) {
                feedContent.innerHTML = '<span style="color:#666;">暂无投票记录，快来投出第一票！</span>';
                return;
            }
            feedContent.innerHTML = data.map(v => {
                const time = new Date(v.created_at).toLocaleString('zh-CN', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
                const dotClass = v.option === 'closed' ? 'closed-dot' : 'open-dot';
                const label = v.option === 'closed' ? '闭卷考试' : '开卷考试';
                const emoji = v.option === 'closed' ? '📖' : '📂';
                return `<div class="feed-item"><span class="feed-dot ${dotClass}"></span>${emoji} 有人投了 <strong>${label}</strong> —— ${time}</div>`;
            }).join('');
        } catch (err) {
            console.error('获取动态失败:', err);
        }
    }

    //  后台管理
    // ============================================

        document.getElementById('adminOverlay').classList.add('active');

            showAdminData();

            document.getElementById('adminLoginArea').style.display = 'block';

        document.getElementById('adminOverlay').classList.remove('active');

    function verifyAdminPassword() {
        const input = document.getElementById('adminPasswordInput').value.trim();
        if (input === ADMIN_PASSWORD) {
            isAdminVerified = true;
            document.getElementById('adminLoginArea').style.display = 'none';
            showAdminData();
            showToast('✅ 验证成功，欢迎进入后台');

            showToast('❌ 密码错误', true);
            document.getElementById('adminPasswordInput').value = '';
            document.getElementById('adminPasswordInput').focus();

    async function showAdminData() {
        document.getElementById('adminDataArea').style.display = 'block';
        document.getElementById('adminLoginArea').style.display = 'none';
        await refreshAdminData();
    }

    async function refreshAdminData() {
        if (!isSupabaseConfigured || !supabaseClient) {
            document.getElementById('adminTotalVotes').textContent = '未连接';
            return;
        }
        const counts = await getVoteCounts();
        document.getElementById('adminTotalVotes').textContent = counts.total;
        document.getElementById('adminClosedVotes').textContent = counts.closed;
        document.getElementById('adminOpenVotes').textContent = counts.open;
        const closedP = counts.total > 0 ? Math.round((counts.closed / counts.total) * 100) : 0;
        const openP = counts.total > 0 ? Math.round((counts.open / counts.total) * 100) : 0;
        document.getElementById('adminClosedPercent').textContent = closedP;
        document.getElementById('adminOpenPercent').textContent = openP;

        // 加载最近记录
        try {
            const { data, error } = await supabaseClient
                .from('votes')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50);
            if (error || !data) return;
            const tbody = document.getElementById('adminRecentBody');
            tbody.innerHTML = data.map(v => {
                const time = new Date(v.created_at).toLocaleString('zh-CN');
                const label = v.option === 'closed' ? '📖 闭卷考试' : '📂 开卷考试';
                return `<tr><td>${time}</td><td>${label}</td></tr>`;
            }).join('');
        } catch (err) {
            console.error('加载记录失败:', err);
        }
    }

    function exportCSV() {
        if (!isSupabaseConfigured || !supabaseClient) return;
        supabaseClient.from('votes').select('*').order('created_at', { ascending: false }).limit(10000)
            .then(({ data, error }) => {
                if (error || !data) {
                    showToast('❌ 导出失败', true);
                    return;
                }
                let csv = '\uFEFF时间,选项\n';
                data.forEach(v => {
                    const time = new Date(v.created_at).toLocaleString('zh-CN');
                    const label = v.option === 'closed' ? '闭卷考试' : '开卷考试';
                    csv += `"${time}","${label}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = '普通化学投票数据_' + new Date().toISOString().slice(0, 10) + '.csv';
                a.click();
                URL.revokeObjectURL(url);
                showToast('📥 CSV 文件已下载');
            });
    }

    async function clearAllVotes() {
        if (!isSupabaseConfigured || !supabaseClient) return;
        const confirmed = confirm(
            '⚠️ 确定要清除全部投票数据吗？\n\n此操作不可撤销！\n\n请在 Supabase 仪表板中确认您有删除权限，\n或使用 service_role key 进行操作。\n\n由于安全限制，清除操作需要在 Supabase 控制台执行。\n点击确定将打开 Supabase 控制台。'
        );
        if (confirmed) {
            // 引导用户到 Supabase 控制台
            window.open(SUPABASE_CONFIG.url.replace('.supabase.co', '.supabase.co/project/default/editor'), '_blank');
            showToast('📋 请在 Supabase 控制台手动清除数据', true);
        }
    }

    // ============================================
    //  点击遮罩关闭后台
    // ============================================
    document.getElementById('adminOverlay').addEventListener('click', function(e) {
        if (e.target === this) {
            closeAdminPanel();
        }
    });

    // ESC 关闭后台
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            const overlay = document.getElementById('adminOverlay');
            if (overlay.classList.contains('active')) {
                closeAdminPanel();
            }
        }
    });

    // ============================================
    //  生成浮动分子粒子背景
    // ============================================
    function createMoleculeParticles() {
        const container = document.getElementById('moleculeParticles');
        const colors = [
            'rgba(231,76,60,0.25)',
            'rgba(41,128,185,0.25)',
            'rgba(240,192,96,0.2)',
            'rgba(46,204,113,0.2)',
            'rgba(155,89,182,0.2)',
            'rgba(255,255,255,0.15)',
        ];
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < 35; i++) {
            const particle = document.createElement('div');
            particle.className = 'molecule-particle';
            const size = 4 + Math.random() * 16;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            particle.style.animationDuration = 8 + Math.random() * 20 + 's';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            fragment.appendChild(particle);
        }
        container.appendChild(fragment);
    }

    // ============================================
    //  定时刷新
    // ============================================
    let autoRefreshInterval = null;

    function startAutoRefresh() {
        autoRefreshInterval = setInterval(async () => {
            await refreshResults();
            await refreshLiveFeed();
            // 如果后台面板打开且已验证，也刷新后台数据
            if (isAdminVerified && document.getElementById('adminOverlay').classList.contains(
                    'active')) {
                await refreshAdminData();
            }
        }, 5000); // 每5秒刷新一次
    }

    // ============================================
    //  页面初始化
    // ============================================
    async function init() {
        createMoleculeParticles();
        initSupabase();

        if (isSupabaseConfigured) {
            await refreshResults();
            await refreshLiveFeed();
            startAutoRefresh();
        } else {
            // 显示未配置状态
            document.getElementById('closedCount').textContent = '-- 票';
            document.getElementById('openCount').textContent = '-- 票';
            document.getElementById('totalVotes').textContent = '未连接数据库';
            document.getElementById('battleCommentary').innerHTML =
                '<span class="comment-icon">⚠️</span> 请配置 Supabase 数据库后刷新页面';
            document.getElementById('feedContent').innerHTML =
                '<span style="color:#888;">数据库未连接，请在源码中配置 Supabase</span>';
        }

        console.log('🧪 普通化学考核方式公投系统已就绪');
        console.log('📖 闭卷考试 vs 📂 开卷考试');
        console.log('🏫 华中科技大学 · 未来技术学院');
        console.log('💡 提示：可在源码顶部修改 SUPABASE_CONFIG 和管理密码');
    }

    init();
</script>
</body>
